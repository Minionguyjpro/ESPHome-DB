# Tenstar ESP32-S3 – Dynamic Display Layout Example
# ==================================================
# This file extends ts-esp32-s3.yaml with the data-driven display system.
# Instead of hard-coding sensor positions in the display lambda, every item
# that should appear on screen is registered once in an on_boot action.
#
# ── How to use this file ──────────────────────────────────────────────────
# Reference this file as your device package instead of ts-esp32-s3.yaml:
#
#   packages:
#     device:
#       url: !secret repo_url
#       files: [common/nl/tenstar/ts-esp32-s3-dynamic.yaml]
#       refresh: 1h
#
#   substitutions:
#     device_name: my-tenstar
#     friendly_name: My Tenstar
#     static_ip: 192.168.1.x
#
# ── Layout overview (240 × 135 px, rotation 90°) ─────────────────────────
#   y=  5      Header bar  (device name  +  Online/Offline)
#   y= 35      Section title
#   y= 60      Temperature in °C  (large font, skipped when NaN)
#   y=100      Temperature in °F  (small font, skipped when NaN)
#   y=120      Internal chip temperature  (shown only when device is online)
# ─────────────────────────────────────────────────────────────────────────

packages:
  # Pull in all base hardware configuration: SPI, I2C, display, LED,
  # buttons, BMP280 sensor, etc.
  base: !include ts-esp32-s3.yaml

esphome:
  on_boot:
    # Priority 600 fires after sensors are initialised but before the first
    # display refresh, so all elements are registered in time.
    priority: 600
    then:
      - lambda: |-
          // ── Static section title ─────────────────────────────────────────
          tenstar_register_element(tenstar_make_text(
              5, 35,
              &id(font20), id(lcd_yellow),
              esphome::display::TextAlign::TOP_LEFT,
              "Weerstation"));

          // ── Outdoor temperature in °C ────────────────────────────────────
          // The element is automatically hidden when the BMP280 returns NaN
          // (e.g. sensor not yet ready at boot).
          tenstar_register_element(tenstar_make_float(
              5, 60,
              &id(medium), id(lcd_green),
              esphome::display::TextAlign::TOP_LEFT,
              "%.1f °C",
              []() { return id(temperature).state; }));

          // ── Outdoor temperature in °F ─────────────────────────────────────
          tenstar_register_element(tenstar_make_float(
              5, 100,
              &id(font20), id(lcd_gray),
              esphome::display::TextAlign::TOP_LEFT,
              "%.1f °F",
              []() {
                return id(temperature).state * 9.0f / 5.0f + 32.0f;
              }));

          // ── Internal chip temperature ─────────────────────────────────────
          // Conditional: only rendered while the device is connected to HA.
          tenstar_register_element(tenstar_make_float(
              5, 120,
              &id(roboto), id(lcd_gray),
              esphome::display::TextAlign::TOP_LEFT,
              "Chip: %.0f °C",
              []() { return id(internal_temperature).state; },
              []() { return id(system_status).state; }));
