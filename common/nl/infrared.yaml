substitutions:
  ir_rx_pin: ""
  ir_tx_pin: ""

packages:
  remote:
    file: ../remote.yaml
    vars:
      ir_rx_pin: ${ir_rx_pin}
      ir_tx_pin: ${ir_tx_pin}

infrared:
  - platform: ir_rf_proxy
    name: IR-zender
    remote_transmitter_id: ir_tx
  - platform: ir_rf_proxy
    name: IR-ontvanger
    remote_receiver_id: ir_rx
