substitutions:
  local: false
  relay_restart_actions: |-
    - switch.turn_off: relay
    - delay: 2s
    - switch.turn_on: relay
  has_relay: "true"
  restore_mode: RESTORE_DEFAULT_OFF

packages:
  common: !include ../generic.yaml
  bluetooth: !include ../../esp32/bluetooth.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -50
    then:
      - lambda: |-
          if (id(boot_mode_value) == "Aan") {
           id(relay).turn_on();
          } else if (id(boot_mode_value) == "Uit") {
            id(relay).turn_off();
          }
          // "Laatste status onthouden" → do nothing, ESPHome restores last state automatically
      - lambda: |-
          id(boot_mode).publish_state(id(boot_mode_value));

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
    
logger:

globals:
  - id: boot_mode_value
    type: std::string
    restore_value: true
    initial_value: '"Laatste status onthouden"'

  - id: saved_state_value
    type: std::string
    restore_value: true
    initial_value: '"Uit"'

  - id: double_press_detected
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: long_double_press_detected
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: overcurrent_alert
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: previous_led_effect
    type: std::string
    restore_value: false
    initial_value: '""'

light:
  - platform: status_led
    id: led
    pin:
      number: GPIO5
      inverted: true
    name: "Blauwe LED"

number:
  - platform: template
    name: "Stroombeveiliging"
    id: current_limit
    optimistic: true
    restore_value: true
    min_value: 0.1
    max_value: 16.0
    step: 0.1
    unit_of_measurement: "A"
    initial_value: 10.0
    mode: box  # or slider
    entity_category: config

interval:
  - interval: 100ms
    then:
      - lambda: |-
          float limit = id(current_limit).state;
          float current = id(current_raw).state;

          static int overcurrent_count = 0;

          if (current > limit && limit > 0) {
            overcurrent_count++;
          } else {
            overcurrent_count = 0;
          }

          if (overcurrent_count >= 3 && !id(overcurrent_alert)) {
            ESP_LOGW("overcurrent", "Overcurrent: %.2fA > %.2fA", current, limit);

            // Save current LED effect
            std::string effect_name = id(led).get_effect_name();
            if (!effect_name.empty()) {
              id(previous_led_effect) = effect_name;
            } else {
              id(previous_led_effect) = "";
            }

            id(relay).turn_off();
            id(overcurrent_alert) = true;
          }

      - if:
          condition:
            lambda: 'return id(overcurrent_alert);'
          then:
            - light.turn_on:
                id: led
                effect: "Waarschuwing"

select:
  - platform: template
    id: boot_mode
    name: "Opstartgedrag"
    icon: mdi:power-settings
    entity_category: config
    restore_value: true
    optimistic: true
    options:
      - "Laatste status onthouden"
      - "Aan"
      - "Uit"
    set_action:
      - lambda: |-
          ESP_LOGI("boot_mode", "Boot mode changed to: %s", x.c_str());
          id(boot_mode_value) = x;

switch:
  - platform: gpio
    pin: GPIO4
    id: relay
    name: None
    restore_mode: ${restore_mode}
    on_turn_on:
      then:
        - lambda: |-
            id(saved_state_value) = "Aan";
            id(overcurrent_alert) = false;

            if (!id(previous_led_effect).empty()) {
              auto call = id(led).turn_on();
              call.set_effect(id(previous_led_effect).c_str());
              call.perform();
            } else {
              id(led).turn_on();
            }
    on_turn_off:
      then:
        - lambda: |-
            id(saved_state_value) = "Uit";

uart:
  rx_pin: GPIO7
  baud_rate: 4800
  parity: EVEN
  id: power_monitoring

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
    name: "Aan-uitknop"
    entity_category: diagnostic
    on_press:
      switch.toggle: relay
    on_multi_click:
      - timing:
          - ON for 30ms to 300ms
          - OFF for at least 150ms
        then:
          - if:
              condition:
                lambda: 'return !id(overcurrent_alert);'
              then:
                - switch.toggle: relay

      - timing:
          - ON for at least 2s
        then:
          - light.toggle: led

      - timing:
          - ON for 50ms to 250ms
          - OFF for 50ms to 200ms
          - ON for 50ms to 250ms
          - OFF for at least 300ms
        then:
          - logger.log: "Double press detected"
          - lambda: |-
              id(double_press_detected) = true;
          - delay: 500ms
          - lambda: |-
              id(double_press_detected) = false;

      - timing:
          - ON for 50ms to 250ms
          - OFF for 50ms to 200ms
          - ON for 50ms to 250ms
          - OFF for 50ms to 200ms
          - ON for 50ms to 250ms
          - OFF for at least 300ms
        then:
          - logger.log: "Triple press detected"
          - lambda: |-
              std::string current = id(led).get_effect_name();

              if (current != "Bliksemflits") {
                if (!current.empty()) {
                  id(previous_led_effect) = current;
                } else {
                  id(previous_led_effect) = "";
                }

                auto call = id(led).turn_on();
                call.set_effect("Bliksemflits");
                call.perform();
              } else {
                if (!id(previous_led_effect).empty()) {
                  auto call = id(led).turn_on();
                  call.set_effect(id(previous_led_effect).c_str());
                  call.perform();
                } else {
                  id(led).turn_off();
                }
              }

      - timing:
          - ON for at least 2s
          - OFF for 200ms to 2s
          - ON for at least 2s
        then:
          - logger.log: "Long double press detected"
          - lambda: |-
              id(long_double_press_detected) = true;
          - delay: 500ms
          - lambda: |-
              id(long_double_press_detected) = false;
  
  - platform: template
    name: "Dubbele druk gedetecteerd"
    lambda: |-
      return id(double_press_detected);

  - platform: template
    name: "Lange dubbele druk gedetecteerd"
    lambda: |-
      return id(long_double_press_detected);
  
  - platform: template
    name: "Stopcontact"
    device_class: plug
    lambda: |-
      if (id(power).state > 0) {
        return true;  // Device is plugged in
      } else {
        return false;  // Device is not plugged in
      }

sensor:
  - platform: cse7766
    uart_id: power_monitoring
    voltage:
      name: "Spanning"
      icon: mdi:sine-wave
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      filters:
        - skip_initial: 3
        - throttle_average: 10s
        - calibrate_linear:
            - 0.0 -> 0.0
            - 122.9 -> 232.6
    current:
      id: current_raw
      internal: true
    power:
      id: power_raw
      internal: true
      filters:
        - skip_initial: 3
        - calibrate_linear:
          - 0.0 -> 0.0
          - 8.8 -> 16.8
        - lambda: |-
            if (x < 0.0 && x > -0.2) return 0.0;
            return x;
            
  - platform: template
    name: "Vermogen"
    icon: mdi:flash-outline
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    id: power
    filters:
      - throttle_average: 10s
    lambda:
      return id(power_raw).state;

  - platform: template
    name: "Stroom"
    icon: mdi:current-ac
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    id: current
    update_interval: 10s
    lambda: |-
      return id(current_raw).state;

  - platform: integration
    name: "Energie"
    sensor: power_raw
    time_unit: h
    restore: true
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    filters:
      - multiply: 0.001  # Converts W·h → kWh

  - platform: internal_temperature
    name: "Interne temperatuur"
    update_interval: 5s
    accuracy_decimals: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
