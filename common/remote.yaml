substitutions:
  ir_rx_pin: ""
  ir_tx_pin: ""

script:
  - id: blink_ir_led
    mode: restart
    then:
      - light.turn_on:
          id: led
          brightness: 100%
          transition_length: 0s
      - delay: 50ms
      - light.turn_off:
          id: led
          transition_length: 0s

remote_receiver:
  - id: ir_rx
    pin:
      number: ${ir_rx_pin}
      inverted: true
    tolerance: 25%
    idle: 30ms
    rmt_symbols: 48
    on_raw:
      - script.execute: blink_ir_led

remote_transmitter:
  - id: ir_tx
    pin: ${ir_tx_pin}
    carrier_duty_percent: 50%
    rmt_symbols: 48
    on_transmit:
      then:
        - light.turn_on:
            id: led
            brightness: 100%
            transition_length: 0s
    on_complete:
      then:
        - light.turn_off:
            id: led
            transition_length: 0s
